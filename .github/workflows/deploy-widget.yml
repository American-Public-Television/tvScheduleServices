name: Deploy widget

on:
  push:
    branches: [prod]
    paths: ["widget/**"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install dependencies
        working-directory: widget
        run: npm ci

      - name: Build
        working-directory: widget
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WIDGET_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Sync to S3
        run: aws s3 sync widget/dist s3://tvss-widget --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_WIDGET_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
